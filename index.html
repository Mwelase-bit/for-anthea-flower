<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Kaylen</title>
<meta name="description" content="A little flower for Kaylen.">
<meta name="theme-color" content="#1b1033">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #1b1033;
    --bg-mid: #3a1752;
    --bg-low: #6b2455;
    --ink: #ffe9f2;
    --rose: #ff6fa5;
    --rose-soft: #ffc2da;
    --stem: #3f9b5a;
    --stem-dark: #276b3f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 1.5svh, 14px);
    padding: 16px;
    overflow-x: hidden;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-low) 100%);
    background-attachment: fixed;
    font-family: 'Dancing Script', 'Segoe Script', 'Brush Script MT', cursive;
    -webkit-tap-highlight-color: transparent;
  }

  /* ambient layers */
  #sky, #rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .star {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #fff; opacity: 0;
    animation: twinkle var(--t) ease-in-out var(--d) infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.6); } 50% { opacity: .85; transform: scale(1.3); } }
  .fall {
    position: absolute; top: -6vh; left: var(--x);
    width: var(--s); height: calc(var(--s) * 1.4);
    background: linear-gradient(160deg, #ffd1e3, #ff6fa5);
    border-radius: 80% 0 80% 0; opacity: 0;
    animation: fall var(--t) linear var(--d) infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0, 0) rotate(0); opacity: 0; }
    10%  { opacity: .85; }
    90%  { opacity: .7; }
    100% { transform: translate(var(--dx), 112vh) rotate(540deg); opacity: 0; }
  }

  /* flower */
  #flower {
    position: relative; z-index: 1;
    height: min(58svh, 540px); width: auto; max-width: 100%;
    aspect-ratio: 400 / 540;
    overflow: visible; cursor: pointer; outline: none;
  }
  #flower:focus-visible { outline: 2px dashed var(--rose-soft); outline-offset: 6px; border-radius: 12px; }
  #sway { transform-origin: 200px 520px; animation: sway 6s ease-in-out 4s infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }

  .glow { opacity: 0; animation: fadein 2.6s ease-out 2s both; }
  .stem { stroke-dasharray: 1; stroke-dashoffset: 1; animation: grow 1.9s cubic-bezier(.45, .05, .25, 1) .2s both; }
  @keyframes grow { to { stroke-dashoffset: 0; } }
  .leaf { transform: scale(0); animation: unfurl 1.1s cubic-bezier(.2, 1.2, .4, 1) var(--d) both; }
  @keyframes unfurl { to { transform: scale(1); } }

  #head { animation: spin 3.6s cubic-bezier(.2, .8, .3, 1) 1.5s both; filter: drop-shadow(0 0 16px rgba(255, 111, 165, .45)); }
  @keyframes spin { from { transform: translate(200px, 190px) rotate(-50deg); } to { transform: translate(200px, 190px) rotate(0); } }
  .petal { transform: scale(.04); opacity: 0; animation: bloom 1.5s cubic-bezier(.2, 1.25, .35, 1) var(--d) both; }
  @keyframes bloom { 30% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
  .seed { opacity: 0; animation: fadein .6s ease-out var(--d) both; }
  .core { transform: scale(0); animation: unfurl .9s cubic-bezier(.2, 1.3, .4, 1) 2.9s both; }
  .shadow { opacity: 0; animation: fadein 1.2s ease-out .2s both; }
  @keyframes fadein { to { opacity: 1; } }

  /* message */
  h1 { margin: 0; text-align: center; font-weight: 700; line-height: 1.05; position: relative; z-index: 1; }
  .name, .line { display: block; opacity: 0; transform: translateY(14px); filter: blur(6px); animation: reveal 1.6s ease-out both; }
  .name { font-size: clamp(2.2rem, 9vw, 3.6rem); color: var(--rose-soft); animation-delay: 4.4s; }
  .line {
    font-size: clamp(2rem, 9.5vw, 4.8rem); animation-delay: 5.2s;
    background: linear-gradient(90deg, #ffd1e3, #ff8fb8 45%, #ffe29a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(255, 111, 165, .25);
  }
  @keyframes reveal { to { opacity: 1; transform: none; filter: none; } }
  .hint {
    margin: 0; position: relative; z-index: 1; font-size: 1.15rem; color: var(--rose-soft); opacity: 0;
    animation: hint 1.2s ease-out 7s both;
  }
  @keyframes hint { to { opacity: .7; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    #sky, #rain { display: none; }
  }
</style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div id="rain" aria-hidden="true"></div>

  <svg id="flower" viewBox="0 0 400 540" role="img" aria-label="A pink flower blooming. Tap it for a shower of petals." tabindex="0">
    <defs>
      <radialGradient id="glow"><stop offset="0" stop-color="#ff6fa5" stop-opacity=".45"/><stop offset="1" stop-color="#ff6fa5" stop-opacity="0"/></radialGradient>
      <linearGradient id="pBack" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-150"><stop offset="0" stop-color="#c2255c"/><stop offset="1" stop-color="#ff8fb8"/></linearGradient>
      <linearGradient id="pMid" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-118"><stop offset="0" stop-color="#ff4f8b"/><stop offset="1" stop-color="#ffb3cf"/></linearGradient>
      <linearGradient id="pFront" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-84"><stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#ffe3ee"/></linearGradient>
      <radialGradient id="core"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f4a62a"/></radialGradient>
      <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#276b3f"/><stop offset="1" stop-color="#58b872"/></linearGradient>
    </defs>

    <ellipse class="shadow" cx="200" cy="524" rx="86" ry="9" fill="#000" opacity=".25"/>
    <circle class="glow" cx="200" cy="190" r="175" fill="url(#glow)"/>

    <g id="sway">
      <path class="stem" pathLength="1" d="M200,522 C196,440 210,330 200,205" fill="none" stroke="var(--stem)" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(201,426) rotate(-28)">
        <g class="leaf" style="--d:1.1s">
          <path d="M0,0 C22,-24 70,-26 100,0 C70,26 22,22 0,0Z" fill="url(#leafG)"/>
          <path d="M6,0 C40,-3 70,-2 94,0" fill="none" stroke="#bfe8c9" stroke-opacity=".45" stroke-width="1.5"/>
        </g>
      </g>
      <g transform="translate(203,363) rotate(-152)">
        <g class="leaf" style="--d:1.35s">
          <path d="M0,0 C22,-24 70,-26 96,0 C70,26 22,22 0,0Z" fill="url(#leafG)"/>
          <path d="M6,0 C40,-3 70,-2 90,0" fill="none" stroke="#bfe8c9" stroke-opacity=".45" stroke-width="1.5"/>
        </g>
      </g>
      <g id="head"></g>
    </g>
  </svg>

  <h1>
    <span class="name">Kaylen,</span>
    <span class="line">you are beautiful</span>
  </h1>
  <p class="hint">tap the flower</p>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // ---- flower head: three petal layers, a golden-angle seed centre ----
  var head = document.getElementById('head');
  var layers = [
    { n: 14, L: 150, W: 34, fill: 'url(#pBack)',  start: 1.9, off: 0 },
    { n: 11, L: 118, W: 31, fill: 'url(#pMid)',   start: 2.4, off: .5 },
    { n: 8,  L: 84,  W: 26, fill: 'url(#pFront)', start: 2.9, off: .25 }
  ];
  layers.forEach(function (ly) {
    for (var i = 0; i < ly.n; i++) {
      var a = (i + ly.off) * 360 / ly.n + (rnd() - .5) * 6;
      var L = ly.L * (.94 + rnd() * .12), W = ly.W;
      var g = el('g', { transform: 'rotate(' + a.toFixed(1) + ')' }, head);
      var p = el('g', { 'class': 'petal' }, g);
      p.style.setProperty('--d', (ly.start + i * .07).toFixed(2) + 's');
      el('path', {
        d: 'M0,0 C' + -W + ',' + -L * .2 + ' ' + -W * 1.15 + ',' + -L * .72 + ' 0,' + -L +
           ' C' + W * 1.15 + ',' + -L * .72 + ' ' + W + ',' + -L * .2 + ' 0,0Z',
        fill: ly.fill, stroke: 'rgba(255,255,255,.28)', 'stroke-width': 1
      }, p);
      el('path', { d: 'M0,-8 L0,' + -L * .68, fill: 'none', stroke: 'rgba(255,255,255,.22)', 'stroke-width': 1.4, 'stroke-linecap': 'round' }, p);
    }
  });
  var core = el('g', { 'class': 'core' }, head);
  el('circle', { r: 27, fill: 'url(#core)' }, core);
  for (var s = 1; s <= 64; s++) {
    var r = 3.1 * Math.sqrt(s), th = s * 137.508 * Math.PI / 180;
    var c = el('circle', { cx: (r * Math.cos(th)).toFixed(2), cy: (r * Math.sin(th)).toFixed(2), r: 1.9, fill: '#b86a0c', 'fill-opacity': .75, 'class': 'seed' }, head);
    c.style.setProperty('--d', (3.3 + s * .012).toFixed(2) + 's');
  }

  // ---- background: twinkling stars + slowly falling petals ----
  var sky = document.getElementById('sky'), rain = document.getElementById('rain');
  for (var i = 0; i < 46; i++) {
    var st = document.createElement('i');
    st.className = 'star';
    st.style.cssText = 'left:' + (rnd() * 100).toFixed(1) + '%;top:' + (rnd() * 70).toFixed(1) + '%;--t:' + (2.5 + rnd() * 3).toFixed(1) + 's;--d:' + (rnd() * 5).toFixed(1) + 's';
    sky.appendChild(st);
  }
  for (var j = 0; j < 20; j++) {
    var fp = document.createElement('i');
    fp.className = 'fall';
    fp.style.cssText = '--x:' + (rnd() * 100).toFixed(1) + '%;--s:' + (8 + rnd() * 9).toFixed(1) + 'px;--t:' + (10 + rnd() * 9).toFixed(1) + 's;--d:' + (5 + rnd() * 12).toFixed(1) + 's;--dx:' + ((rnd() - .5) * 180).toFixed(0) + 'px';
    rain.appendChild(fp);
  }

  // ---- tap / Enter: burst of petals ----
  var flower = document.getElementById('flower');
  function burst(x, y) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var k = 0; k < 22; k++) {
      var b = document.createElement('i');
      var size = 8 + Math.random() * 10;
      b.style.cssText = 'position:fixed;z-index:5;pointer-events:none;left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size * 1.4 + 'px;border-radius:80% 0 80% 0;background:linear-gradient(160deg,#ffd1e3,#ff6fa5)';
      document.body.appendChild(b);
      var ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 160;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 40;
      var anim = b.animate([
        { transform: 'translate(-50%,-50%) rotate(0) scale(.4)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random() * 540 - 270) + 'deg) scale(1)', opacity: 1, offset: .55 },
        { transform: 'translate(' + dx * 1.15 + 'px,' + (dy + 140) + 'px) rotate(' + (Math.random() * 720 - 360) + 'deg) scale(.9)', opacity: 0 }
      ], { duration: 1500 + Math.random() * 900, easing: 'cubic-bezier(.2,.7,.3,1)' });
      anim.onfinish = (function (n) { return function () { n.remove(); }; })(b);
    }
  }
  flower.addEventListener('click', function (e) { burst(e.clientX, e.clientY); });
  flower.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      var r = flower.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * .35);
    }
  });
})();
</script>
</body>
</html>
